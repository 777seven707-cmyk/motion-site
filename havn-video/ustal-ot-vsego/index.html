<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAVN · Устал от всего?</title>
<style>
  html,body{margin:0;background:#1a1a1a;height:100%}
  body{display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;width:auto;max-width:100vw;display:block}
</style>
</head>
<body>
<!-- edge filters used while building the sprites: scissor cut, torn paper, three ink variants for the boil -->
<svg width="0" height="0" style="position:absolute">
  <filter id="cut" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="4" result="lo"/>
    <feDisplacementMap in="SourceGraphic" in2="lo" scale="7" xChannelSelector="R" yChannelSelector="G" result="d1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="1" seed="9" result="hi"/>
    <feDisplacementMap in="d1" in2="hi" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="torn" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="4" seed="7" result="lo"/>
    <feDisplacementMap in="SourceGraphic" in2="lo" scale="16" xChannelSelector="R" yChannelSelector="G" result="d1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="2" result="hi"/>
    <feDisplacementMap in="d1" in2="hi" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="ink0" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="11" result="lo"/>
    <feDisplacementMap in="SourceGraphic" in2="lo" scale="4" xChannelSelector="R" yChannelSelector="G" result="d1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="5" result="hi"/>
    <feDisplacementMap in="d1" in2="hi" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="ink1" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="23" result="lo"/>
    <feDisplacementMap in="SourceGraphic" in2="lo" scale="4" xChannelSelector="R" yChannelSelector="G" result="d1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="17" result="hi"/>
    <feDisplacementMap in="d1" in2="hi" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="ink2" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="37" result="lo"/>
    <feDisplacementMap in="SourceGraphic" in2="lo" scale="4" xChannelSelector="R" yChannelSelector="G" result="d1"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="29" result="hi"/>
    <feDisplacementMap in="d1" in2="hi" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="scene.js"></script>
</body>
</html>
